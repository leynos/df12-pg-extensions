name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, format and workflow contracts
    # A pull request from a fork cannot obtain an Ubicloud runner, so it falls
    # back to the hosted pool; so does a Dependabot pull request, which
    # GitHub-hosted runners serve at no charge on a public repository. The
    # author is tested, not the actor, because the actor is whoever triggered
    # the run, so a person pushing to a Dependabot branch would flip the
    # runner. The continuation stays at this indent: a deeper one keeps its
    # line break inside the expression.
    runs-on: >-
      ${{ (github.event.pull_request.head.repo.fork
      || github.event.pull_request.user.login == 'dependabot[bot]')
      && 'ubuntu-latest' || 'ubicloud-standard-2' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: false
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@8de2aa07cae85fd17c0b35642db70cf5495f1d25
        with:
          globs: '**/*.md'
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@0606ca899ce2995a0c4bc78e660e80832e6e8855
        with:
          version: "0.6.1"

      - name: Check formatting
        run: make check-fmt
      - name: Install the YAML lint tools
        uses: leynos/shared-actions/.github/actions/install-yaml-lint@26c918632c5413039a84358fafe012a4399a9ec7
      - name: Lint shell, Python and YAML
        # The pinned markdownlint action above already lints Markdown, so the
        # local markdownlint-cli2 call is replaced by a no-op here.
        run: make lint MDLINT=true
      - name: Unit tests and workflow contracts
        run: make test

  smoke-build:
    name: Smoke build (configured smoke leg)
    # As `checks`: a fork or a Dependabot pull request takes the hosted arm.
    runs-on: >-
      ${{ (github.event.pull_request.head.repo.fork
      || github.event.pull_request.user.login == 'dependabot[bot]')
      && 'ubuntu-latest' || 'ubicloud-standard-2' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Resolve the smoke leg from extensions.toml
        id: leg
        run: python3 scripts/matrix.py extensions.toml --smoke-leg >> "$GITHUB_OUTPUT"
      - name: Build extension archive in the pinned container
        env:
          EXT_NAME: ${{ steps.leg.outputs.name }}
          EXT_PACKAGE: ${{ steps.leg.outputs.package }}
          EXT_VERSION: ${{ steps.leg.outputs.version }}
          EXT_REPOSITORY: ${{ steps.leg.outputs.repository }}
          EXT_TAG: ${{ steps.leg.outputs.tag }}
          EXT_COMMIT: ${{ steps.leg.outputs.commit }}
          PG_VERSION: ${{ steps.leg.outputs.postgresql }}
          TARGET: ${{ steps.leg.outputs.target }}
          PLATFORM: ${{ steps.leg.outputs.platform }}
          ARCHIVE: ${{ steps.leg.outputs.archive }}
          THESEUS_RELEASES_URL: ${{ steps.leg.outputs.releases_url }}
          MAX_GLIBC: ${{ steps.leg.outputs.max_glibc }}
        run: bash scripts/build_extension.sh
      - name: Check archive layout and sidecar
        env:
          ARCHIVE: ${{ steps.leg.outputs.archive }}
        run: python3 scripts/build_manifest.py check-archive "dist/$ARCHIVE"
      - name: Load the extension into a Theseus PostgreSQL and query it
        env:
          EXT_NAME: ${{ steps.leg.outputs.name }}
          PG_VERSION: ${{ steps.leg.outputs.postgresql }}
          TARGET: ${{ steps.leg.outputs.target }}
          ARCHIVE_PATH: dist/${{ steps.leg.outputs.archive }}
          SMOKE_SQL: ${{ steps.leg.outputs.smoke_sql }}
          THESEUS_RELEASES_URL: ${{ steps.leg.outputs.releases_url }}
        run: bash scripts/smoke_test.sh
